<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ludo Empire - Premium Board Game</title>
    <style>
      /* Premium Font Import */
      @import url('https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,300;14..32,400;14..32,500;14..32,600;14..32,700;14..32,800;14..32,900&display=swap');
      
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }

      body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
        min-height: 100vh;
        overflow-x: hidden;
      }

      /* Custom Scrollbar */
      ::-webkit-scrollbar {
        width: 8px;
        height: 8px;
      }

      ::-webkit-scrollbar-track {
        background: rgba(255, 255, 255, 0.1);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border-radius: 10px;
      }

      ::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(135deg, #818cf8, #a78bfa);
      }

      /* Glassmorphism Effect */
      .glass {
        background: rgba(255, 255, 255, 0.1);
        backdrop-filter: blur(10px);
        border: 1px solid rgba(255, 255, 255, 0.2);
      }

      /* Dice Animation Keyframes */
      @keyframes diceRoll {
        0% {
          transform: rotate(0deg) scale(1);
        }
        25% {
          transform: rotate(90deg) scale(1.1);
        }
        50% {
          transform: rotate(180deg) scale(1.2);
        }
        75% {
          transform: rotate(270deg) scale(1.1);
        }
        100% {
          transform: rotate(360deg) scale(1);
        }
      }

      @keyframes diceShake {
        0% { transform: translate(0, 0) rotate(0deg); }
        10% { transform: translate(-4px, -4px) rotate(-5deg); }
        20% { transform: translate(4px, -4px) rotate(5deg); }
        30% { transform: translate(-4px, 4px) rotate(-5deg); }
        40% { transform: translate(4px, 4px) rotate(5deg); }
        50% { transform: translate(-2px, -2px) rotate(-3deg); }
        60% { transform: translate(2px, -2px) rotate(3deg); }
        70% { transform: translate(-2px, 2px) rotate(-3deg); }
        80% { transform: translate(2px, 2px) rotate(3deg); }
        90% { transform: translate(-1px, -1px) rotate(-1deg); }
        100% { transform: translate(0, 0) rotate(0deg); }
      }

      @keyframes diceGlow {
        0% {
          box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.7);
        }
        70% {
          box-shadow: 0 0 0 20px rgba(99, 102, 241, 0);
        }
        100% {
          box-shadow: 0 0 0 0 rgba(99, 102, 241, 0);
        }
      }

      @keyframes float {
        0%, 100% { transform: translateY(0px); }
        50% { transform: translateY(-10px); }
      }

      @keyframes pulse-ring {
        0% {
          transform: scale(0.8);
          opacity: 0.8;
        }
        100% {
          transform: scale(1.5);
          opacity: 0;
        }
      }

      .dice-rolling {
        animation: diceShake 0.5s cubic-bezier(0.36, 0.07, 0.19, 0.97) both,
                   diceGlow 0.8s ease-in-out infinite !important;
      }

      .dice-value-reveal {
        animation: diceRoll 0.6s cubic-bezier(0.68, -0.55, 0.265, 1.55) !important;
      }

      /* Token Glow Effect */
      .token-glow {
        position: relative;
      }

      .token-glow::before {
        content: '';
        position: absolute;
        inset: -4px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(99,102,241,0.6), transparent);
        animation: pulse-ring 1.5s cubic-bezier(0.215, 0.61, 0.355, 1) infinite;
        pointer-events: none;
      }

      /* Particle Effect Container */
      .particle-container {
        position: fixed;
        pointer-events: none;
        z-index: 1000;
      }

      .particle {
        position: absolute;
        width: 6px;
        height: 6px;
        border-radius: 50%;
        animation: particleFade 0.8s ease-out forwards;
      }

      @keyframes particleFade {
        0% {
          transform: scale(1);
          opacity: 1;
        }
        100% {
          transform: scale(0);
          opacity: 0;
        }
      }

      /* Board Cell Hover Effect */
      .board-cell {
        transition: all 0.2s ease;
      }

      .board-cell:hover {
        transform: scale(1.02);
        filter: brightness(1.05);
      }

      /* Custom Button Styles */
      .btn-premium {
        background: linear-gradient(135deg, #6366f1, #8b5cf6);
        border: none;
        position: relative;
        overflow: hidden;
        transition: all 0.3s ease;
      }

      .btn-premium::before {
        content: '';
        position: absolute;
        top: 50%;
        left: 50%;
        width: 0;
        height: 0;
        border-radius: 50%;
        background: rgba(255, 255, 255, 0.3);
        transform: translate(-50%, -50%);
        transition: width 0.6s, height 0.6s;
      }

      .btn-premium:hover::before {
        width: 300px;
        height: 300px;
      }

      .btn-premium:hover {
        transform: translateY(-2px);
        box-shadow: 0 10px 25px -5px rgba(99, 102, 241, 0.4);
      }

      .btn-premium:active {
        transform: translateY(1px);
      }

      /* Winner Celebration */
      .winner-celebration {
        animation: float 2s ease-in-out infinite;
      }

      /* Loading Spinner */
      .spinner {
        width: 40px;
        height: 40px;
        border: 3px solid rgba(99, 102, 241, 0.3);
        border-top-color: #6366f1;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
      }

      @keyframes spin {
        to { transform: rotate(360deg); }
      }

      /* Card Hover Effects */
      .premium-card {
        transition: transform 0.3s ease, box-shadow 0.3s ease;
      }

      .premium-card:hover {
        transform: translateY(-4px);
        box-shadow: 0 20px 25px -12px rgba(0, 0, 0, 0.25);
      }

      /* Text Gradient */
      .text-gradient {
        background: linear-gradient(135deg, #6366f1, #a855f7, #ec4899);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }

      /* Neumorphic Elements */
      .neumorph {
        background: linear-gradient(145deg, #f0f0f0, #e0e0e0);
        box-shadow: 5px 5px 12px #bebebe, -5px -5px 12px #ffffff;
      }

      /* Responsive Adjustments */
      @media (max-width: 768px) {
        .board-cell:hover {
          transform: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
